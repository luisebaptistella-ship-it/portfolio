<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skills — Luise Baptistella</title>
  <meta name="description" content="Portfolio of Luise Baptistella, creative director & designer: brand identity, art direction, motion design and social content.">
  <meta name="theme-color" content="#120F0D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Switzer Black: free Helvetica-style grotesk (Fontshare, free for commercial use) -->
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@900,901&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <!-- ============ HEADER ============ -->
  <header class="nav is-solid" id="top">
    <a class="nav__logo" href="index.html">Luise Baptistella</a>
    <span class="nav__title" data-i18n="nav.portfolio">Portfolio</span>
    <div class="nav__right">
      <button class="nav__menu" type="button" aria-expanded="false" aria-controls="nav-links"><span data-i18n="nav.menu">Menu</span> <span class="nav__burger" aria-hidden="true"></span></button>
      <nav class="nav__links" id="nav-links" aria-label="Main">
        <a href="index.html#skills" data-i18n="nav.skills" aria-current="page">Skills</a>
        <a href="index.html#work" data-i18n="nav.work">Work</a>
        <a href="about.html" data-i18n="nav.about">About</a>
        <span class="nav__lang" role="group" aria-label="Language / Langue / Idioma">
          <button type="button" data-lang="en" aria-pressed="true">EN</button><span aria-hidden="true">/</span><button type="button" data-lang="fr" aria-pressed="false">FR</button><span aria-hidden="true">/</span><button type="button" data-lang="pt" aria-pressed="false">PT</button>
        </span>
      </nav>
    </div>
  </header>

  <main id="main">

    <!-- ============ SKILL PAGE: filled from SKILLS + PROJECTS (projects.js) ============ -->
    <section class="skillpage" data-skill-page>
      <a class="skillpage__back" href="index.html#skills" data-i18n="page.back">← All skills</a>
      <p class="kicker skillpage__num"></p>
      <h1 class="skillpage__title"></h1>
      <p class="skillpage__intro"></p>
      <p class="skillpage__count"></p>
      <div class="skillpage__list"></div>
      <nav class="skillpage__others" aria-labelledby="others-title">
        <h2 id="others-title" data-i18n="page.otherSkills">Other skills</h2>
        <ul></ul>
      </nav>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="section-head">
        <h2 id="contact-title" data-i18n="contact.title">Contact</h2>
      </div>
      <div class="contact__cta">
        <a class="contact__card" href="contact.html" data-i18n="contact.cta">wanna talk more?</a>
        <a class="contact__mail" href="mailto:luisebaptistella@gmail.com">luisebaptistella@gmail.com</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <nav class="footer__social" aria-label="Social">
      <a href="https://www.instagram.com/coloredbylou/">Instagram</a>
      <a href="https://www.linkedin.com/in/luisebaptistella/">LinkedIn</a>
      <a href="https://www.behance.net/luisebaptist">Behance</a>
    </nav>
    <span>© 2026 Luise Baptistella</span>
    <a href="#top" data-i18n="footer.top">Back to top ↑</a>
  </footer>

  <!-- Project view, filled from projects.js -->
  <dialog class="project" id="project" aria-labelledby="project-title">
    <div class="project__bar">
      <span class="project__count"></span>
      <button class="project__close" type="button" data-i18n="project.close">Close ✕</button>
    </div>
    <div class="project__hero" hidden></div>
    <article class="project__body">
      <h2 class="project__title" id="project-title"></h2>
      <dl class="project__meta">
        <div><dt data-i18n="project.client">Client</dt><dd data-field="client"></dd></div>
        <div><dt data-i18n="project.year">Year</dt><dd data-field="year"></dd></div>
        <div><dt data-i18n="project.category">Category</dt><dd data-field="category"></dd></div>
      </dl>
      <div class="project__text"></div>
      <div class="project__deliv">
        <h3 data-i18n="project.deliverables">Deliverables</h3>
        <ul></ul>
      </div>
      <div class="project__media"></div>
      <button class="project__next" type="button"><span data-i18n="project.next">Next project</span> <strong></strong> →</button>
    </article>
  </dialog>

  <script src="i18n.js"></script>
  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
